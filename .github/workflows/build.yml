# This workflow will install Python dependencies, build debs, and upload to pypi.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python build

on:
  push:
    tags:
      - 'v*.*.*'
    # Always manually run on CI
    branches: [ CI ]
  # Actually exercise the .deb build/release pipeline on PRs that touch it,
  # instead of only finding out it's broken when cutting a real release.
  # build_deb/build_pypi_wheel/release stay gated to `push` below (an `if:`
  # on each) -- this must never trigger a real PyPI publish/GitHub release
  # from a PR. Only test_deb_install runs here.
  pull_request:
    paths:
      - 'debian/**'
      - 'apt-requirements.txt'
      - 'pip-requirements.txt'
      - 'setup.py'
      - 'setup.cfg'
      - '.github/workflows/build.yml'

jobs:

  build_deb:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v5
      with:
        # This path is specific to Ubuntu
        path: ~/.cache/pip
        # Look to see if there is a cache hit for the corresponding requirements file
        key: ${{ runner.os }}-pip-${{ hashFiles('pip-requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat apt-requirements.txt)
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov wheel
        pip install -r pip-requirements.txt

    - name: Build .deb
      # Developed from instructions on the wiki
      # The debian/ folder contains dependencies etc, so all this action needs to do is activate the process.
      run: |
        debian/build.sh
        mkdir debs
        mv ../*.deb debs

    - name: Upload built debs as artifacts
      uses: actions/upload-artifact@v7
      with:
        name: debs
        path: debs



  build_pypi_wheel:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v5
      with:
        # This path is specific to Ubuntu
        path: ~/.cache/pip
        # Look to see if there is a cache hit for the corresponding requirements file
        key: ${{ runner.os }}-pip-${{ hashFiles('pip-requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat apt-requirements.txt)
        python -m pip install --upgrade pip
        pip install build

    - name: Build a binary wheel and a source tarball
      run: >-
        python -m
        build
        --sdist
        --wheel
        --outdir dist/

    - name: Upload built dist as artifact
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/



  release:
    # Belt and suspenders: needs: [build_pypi_wheel, build_deb] already
    # keeps this from running unless both succeeded, and neither runs on
    # `pull_request` (see their own `if:`) -- but this job publishes to
    # PyPI and creates a GitHub release, so it must never fire from a PR
    # even indirectly.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14]
    needs: [build_pypi_wheel, build_deb]
    steps:
    - uses: actions/checkout@v6
      with:
        # Fetch all history so that we get tags.
        fetch-depth: 0

      # Waits for checks to complete before releasing.
    - name: Wait on tests
      uses: lewagon/wait-on-check-action@v1.6.1
      with:
        ref: ${{ github.ref }}
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 10
        check-name: 'pytest (3.14)'

    - name: Download built dist as artifact
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Download built debs as artifacts
      uses: actions/download-artifact@v8
      with:
        name: debs
        path: ../debs


    - name: Publish a Python distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

    - name: Create a release and attach files
      run: |
        git fetch --tags --force
        origin="$(git config --get remote.origin.url)"
        # Will get tag name only if a tag triggered this workflow.
        # tagname="${GITHUB_REF#refs/tags/}"
        # Use this to get the most recent tag on this branch rather than the tag triggering the current build.
        tagname="$(git describe --tags --abbrev=0 --match "v*.*.*")"
        prerelease="--prerelease"
        notes="[See here for changelog for this release]($origin/blob/$tagname/CHANGELOG.rst)"
        # If we are a tag and on master, should be a full release not a prerelease
        if git branch --all --contains tags/$tagname | grep --silent "master"; then
          prerelease=""
        fi
        # Include other files by adding them as additional arguments
        gh release create "$tagname" ../debs/*.deb --title "$tagname" --notes "$notes" $prerelease
    # ../autokey-common_${{ github.ref }}_all.deb
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}



  test_deb_install:
    # Runs on both push (tags/CI branch) and the pull_request trigger
    # above -- unlike build_deb/build_pypi_wheel/release, this job does
    # nothing but build, install, and remove packages locally, so it's
    # safe to run from a PR.
    #
    # build_deb above only ever builds the .deb and uploads it as an
    # artifact; nothing in this workflow ever installed one, so a broken
    # autokey-common postinst/prerm (e.g. #1277) was invisible here even
    # when the build itself succeeded. This also runs across both the
    # current and next Ubuntu LTS, since dpkg-dev's strictness and
    # package availability both vary by version -- confirmed live while
    # testing #1277/#1281/#1282 on the VM fleet: a malformed
    # debian/control Maintainer field and a renamed apt package
    # (graphicsmagick-imagemagick-compat) only broke the build on Ubuntu
    # 26.04, not 24.04. ubuntu-latest itself is migrating to 26.04, so
    # without this matrix those bugs would otherwise surface with no
    # warning whenever that migration lands.
    name: Test .deb build and install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install build and runtime dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat debian/build_requirements.txt) $(cat apt-requirements.txt)

    - name: Build .deb packages
      run: debian/build.sh

    - name: Install built .deb packages (exercises autokey-common's postinst)
      run: sudo apt-get install -y ../autokey-common_*.deb ../autokey-gtk_*.deb ../autokey-qt_*.deb

    - name: Verify install
      run: |
        command -v autokey-gtk
        command -v autokey-qt
        test -f /etc/udev/rules.d/10-autokey.rules

    - name: Remove installed packages (exercises autokey-common's prerm)
      run: sudo apt-get remove -y autokey-common autokey-gtk autokey-qt

    - name: Verify removal
      run: test ! -f /etc/udev/rules.d/10-autokey.rules

